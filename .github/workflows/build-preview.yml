name: Build private engineering preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: shedbuilt-build-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate physics and catalogues
        run: |
          set -euo pipefail
          python3 scripts/validate_catalogue.py
          node --test tests/*.test.mjs
          node --check web-lab/main.mjs
          node --check web-lab/physics.mjs
      - name: Verify preview has an authentication guard
        run: |
          set -euo pipefail
          grep -q 'shedbuilt-preview.middlewares=' infra/stack.preview.yml
          grep -q 'shedbuilt.virtualhowto.com' infra/preflight-preview.sh
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build tested immutable preview candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}-preview:git-${GITHUB_SHA}"
          docker build --pull --file infra/Dockerfile.preview --build-arg BUILD_SHA="$GITHUB_SHA" --tag "$image" .
          digest="$(docker push --quiet "$image" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected image digest: $digest" >&2; exit 1; }
          echo "image=ghcr.io/${repo}-preview@${digest}" >> "$GITHUB_OUTPUT"
      - name: Record deployment candidate
        env:
          BUILT_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          echo '### Shedbuilt preview image (manual deployment only)' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$BUILT_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production requires authenticated Traefik middleware and an approved deployment.' >> "$GITHUB_STEP_SUMMARY"
