name: Shedbuilt validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  structural-and-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate part and challenge schemas
        run: python3 scripts/validate_catalogue.py
      - name: JavaScript syntax and physics fixtures
        run: |
          node --check web-lab/physics.mjs
          node --check web-lab/main.mjs
          node --test tests/*.test.mjs
      - name: Forbid committed secret files
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|id_rsa$|\.pem$|\.p12$)'; then echo 'ERROR: secrets found' >&2; exit 1; fi
      - name: Confirm private-first game configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('infra/stack.yml').read_text()
          assert 'ports:' not in text
          assert 'shedbuilt_lobby_key' in text
          assert 'mode: host' not in text
          print('PASS: private-first Swarm template')
          PY
  godot-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Godot 4.6 and verified templates
        env:
          GODOT_LINUX_SHA256: ${{ vars.GODOT_LINUX_SHA256 }}
          GODOT_TEMPLATES_SHA256: ${{ vars.GODOT_TEMPLATES_SHA256 }}
        run: |
          set -euo pipefail
          : "${GODOT_LINUX_SHA256:?Repo variable GODOT_LINUX_SHA256 must be configured}"
          : "${GODOT_TEMPLATES_SHA256:?Repo variable GODOT_TEMPLATES_SHA256 must be configured}"
          test "${#GODOT_LINUX_SHA256}" -eq 64
          test "${#GODOT_TEMPLATES_SHA256}" -eq 64
          base='https://github.com/godotengine/godot/releases/download/4.6-stable'
          curl -fL --retry 3 "$base/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo "$GODOT_LINUX_SHA256  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-dir
          sudo install -m 0755 /tmp/godot-dir/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo "$GODOT_TEMPLATES_SHA256  /tmp/templates.tpz" | sha256sum -c -
          mkdir -p /tmp/godot-tmpl "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-tmpl
          cp /tmp/godot-tmpl/templates/* "$HOME/.local/share/godot/export_templates/4.6.stable/"
          godot --version
      - name: Godot headless import and deterministic tests
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --import --quit
          godot --headless --path godot --script res://tests/test_physics.gd
      - name: Export actual browser game and Linux headless server
        run: |
          set -euo pipefail
          mkdir -p build/web build/server
          godot --headless --path godot --export-release Web "$PWD/build/web/index.html"
          godot --headless --path godot --export-release 'Linux Server' "$PWD/build/server/shedbuilt.x86_64"
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/server/shedbuilt.x86_64
      - name: Store tested export artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shedbuilt-godot-4.6-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7
