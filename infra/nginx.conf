server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(wasm|pck|js|svg|png)$ { expires 1h; add_header Cache-Control "public"; }
    types { application/wasm wasm; application/octet-stream pck; }
}
